<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager with Supabase</title>
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        window.createClient = createClient;
    </script>
    <style>
        :root { --primary: #4f46e5; --primary-hover: #4338ca; --bg-color: #f8fafc; --card-bg: #ffffff; --text-main: #1e293b; --text-muted: #64748b; --border: #e2e8f0; --status-open: #3b82f6; --status-working: #eab308; --status-completed: #22c55e; --status-cancelled: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 2rem 1rem; }
        .container { max-width: 900px; margin: 0 auto; }
        header { margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 1rem 1.5rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); }
        .card { background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); padding: 1.5rem; margin-bottom: 2rem; }
        h2 { font-size: 1.25rem; margin-bottom: 1rem; color: var(--text-main); }
        .form-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; }
        @media(min-width: 768px) { .form-grid { grid-template-columns: 2fr 1fr auto; } }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-main); }
        input, textarea, select { padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; width: 100%; }
        button { background-color: var(--primary); color: white; border: none; padding: 0.75rem 1.5rem; font-size: 1rem; font-weight: 600; border-radius: 8px; cursor: pointer; }
        button:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: #64748b; }
        .filters { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .filter-btn { background: var(--card-bg); color: var(--text-muted); border: 1px solid var(--border); padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; }
        .filter-btn.active { background: var(--primary); color: white; }
        .task-list { display: flex; flex-direction: column; gap: 1rem; }
        .task-item { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; }
        .status-badge { padding: 0.25rem 0.75rem; border-radius: 50px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: white; }
        .badge-Open { background-color: var(--status-open); }
        .badge-Working { background-color: var(--status-working); }
        .badge-Completed { background-color: var(--status-completed); }
        .badge-Cancelled { background-color: var(--status-cancelled); }
        .hidden { display: none !important; }
        .user-table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        .user-table th, .user-table td { border: 1px solid var(--border); padding: 0.75rem; text-align: left; }
    </style>
</head>
<body>

    <div id="appScreen" class="container">
        <header>
            <h1>Task Manager</h1>
        </header>

        <div id="adminUserSection" class="card">
            <h2>Create New User Account</h2>
            <form id="createUserForm" class="form-grid" style="grid-template-columns: 1fr 1fr auto;">
                <input type="text" id="newUsername" required placeholder="New username">
                <input type="password" id="newPassword" required placeholder="New password">
                <button type="submit">Create User</button>
            </form>
            <table class="user-table" id="userTable">
                <thead><tr><th>Username</th><th>Role</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>

        <div id="adminTaskSection" class="card">
            <h2>Create Global Task</h2>
            <form id="taskForm" class="form-grid">
                <input type="text" id="taskTitleInput" placeholder="Task Name" required>
                <input type="date" id="taskDeadlineInput" required>
                <button type="submit">Publish Task</button>
            </form>
        </div>

        <div class="card">
            <h2>Task Workspace</h2>
            <div class="filters" id="filters">
                <button class="filter-btn active" onclick="filterTasks('All')">All</button>
                <button class="filter-btn" onclick="filterTasks('Open')">Open</button>
                <button class="filter-btn" onclick="filterTasks('Working')">Working</button>
                <button class="filter-btn" onclick="filterTasks('Completed')">Completed</button>
            </div>
            <div class="task-list" id="taskList"></div>
        </div>
    </div>

    <script>
        let _supabase;
        let tasks = [];
        let users = [];

        window.addEventListener('DOMContentLoaded', async () => {
            _supabase = window.createClient('https://zgetzwielvoqvqyfrimp.supabase.co', 'sb_publishable_-MnwUNpSgxYNcPi2s5jT7A_yNv6KjZW');
            await initAdmin();
            await fetchUsers();
            await fetchTasks();
        });

        async function initAdmin() {
            const { data: adminExists } = await _supabase.from('users').select('*').eq('username', 'Dhanu');
            if (!adminExists || adminExists.length === 0) {
                await _supabase.from('users').insert([{ username: 'Dhanu', password: 'Dhanu@2002', role: 'admin' }]);
            }
        }

        async function fetchUsers() {
            const { data } = await _supabase.from('users').select('*');
            if (data) {
                users = data;
                const tbody = document.querySelector('#userTable tbody');
                tbody.innerHTML = users.map(u => `<tr><td>${u.username}</td><td>${u.role}</td></tr>`).join('');
            }
        }

        async function fetchTasks() {
            const { data } = await _supabase.from('tasks').select('*').order('id', { ascending: false });
            tasks = data || [];
            renderTasks('All');
        }

        function renderTasks(filter) {
            const list = document.getElementById('taskList');
            const filtered = filter === 'All' ? tasks : tasks.filter(t => t.status === filter);
            list.innerHTML = filtered.map(t => `
                <div class="task-item">
                    <div class="task-header">
                        <strong>${t.title}</strong>
                        <span class="status-badge badge-${t.status}">${t.status}</span>
                    </div>
                    <p>Due: ${t.deadline}</p>
                    <select onchange="updateTask(${t.id}, this.value)">
                        <option value="Open" ${t.status==='Open'?'selected':''}>Open</option>
                        <option value="Working" ${t.status==='Working'?'selected':''}>Working</option>
                        <option value="Completed" ${t.status==='Completed'?'selected':''}>Completed</option>
                    </select>
                </div>
            `).join('');
        }

        async function updateTask(id, status) {
            await _supabase.from('tasks').update({ status }).eq('id', id);
            await fetchTasks();
        }

        document.getElementById('taskForm').onsubmit = async (e) => {
            e.preventDefault();
            await _supabase.from('tasks').insert([{ title: document.getElementById('taskTitleInput').value, deadline: document.getElementById('taskDeadlineInput').value }]);
            await fetchTasks();
        }

        document.getElementById('createUserForm').onsubmit = async (e) => {
            e.preventDefault();
            await _supabase.from('users').insert([{ username: document.getElementById('newUsername').value, password: document.getElementById('newPassword').value, role: 'user' }]);
            await fetchUsers();
        }

        function filterTasks(f) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.innerText === f));
            renderTasks(f);
        }
    </script>
</body>
</html>
